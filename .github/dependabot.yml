# Weekly version updates, one grouped pull request per ecosystem so CI runs
# once per batch. Security updates still arrive on their own when GitHub
# raises an alert. Major versions come as separate PRs: they need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
