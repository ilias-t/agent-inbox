# Weekly version updates, one grouped pull request per ecosystem so CI runs
# once per batch. Security updates still arrive on their own when GitHub
# raises an alert. Major versions come as separate PRs: they need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # CI and the deploy action run Node 22, so the types track 22.x. Revisit
      # when both move to a newer Node line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types: [minor, patch]
